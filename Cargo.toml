[workspace]
resolver = "3"
members = ["server"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json"] }
# A thread's processor time, which std does not read, for the tests that time how work grows.
cpu-time = "=1.0.0"
# GCRA alone: the keyed state is kit-server's own, and the clock std's monotonic one.
governor = { version = "0.10.4", default-features = false, features = ["std"] }
hmac = "0.13.0"
# Property tests, which shrink a failing case to its smallest; no forking runner.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "json",
  "form",
  "http2",
] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["macros", "signal", "time"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["yaml"] }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
let_underscore_drop = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Every panicking path is denied by name; the shipped binary has no unwind path to reach.
arithmetic_side_effects = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
string_slice = "deny"
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
mem_forget = "deny"
str_to_string = "deny"
verbose_file_reads = "deny"
# A conversion says what it does when the value doesn't fit; `as` truncates, wraps or rounds
# without a word.
as_conversions = "deny"
# An error turned into another keeps what went wrong, and a Result dropped for an Option is
# handled instead.
map_err_ignore = "deny"
unused_result_ok = "deny"
# A lint allowed in the code says why.
allow_attributes_without_reason = "deny"
# pub(crate) trips this where plain pub trips rustc's unreachable_pub; pub(crate) is truthful.
redundant_pub_crate = "allow"
# Duplicate transitive versions are gated by deny.toml's [bans], not per crate.
multiple_crate_versions = "allow"
# A doc comment says what the code can't; a plain Result or panic-free code needs none.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
