[package]
name = "kit-server"
description = "What the tonalisk-labs backends share: configuration, Stripe, rate limits, problem details, stopping, the OpenAPI export, and how work grows in processor time."
version = "1.0.4"
repository = "https://github.com/tonalisk-labs/kit"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# How work grows with its input, for a backend's tests: `kit_server::growth`.
growth = ["dep:cpu-time"]

[dependencies]
axum = { workspace = true }
cpu-time = { workspace = true, optional = true }
governor = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "test-util"] }
