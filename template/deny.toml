[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

# Permissive only. A copyleft crate reaching a shipped binary is a licensing decision, not a
# dependency bump, so it fails the check until it is made deliberately.
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # Mozilla's root certificates, as data: webpki-root-certs, which reqwest brings through rustls.
  "CDLA-Permissive-2.0",
  # Public-domain equivalent: strictly more permissive than MIT.
  "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
# A second version of a crate builds twice and patches apart: each skip names the crate that still
# holds it, and goes once that crate moves. Any other fails the check.
skip = []

# What runs at build time is named: a crate that starts shipping a build script fails the check
# until it is read and added here, and none may bring a prebuilt executable.
[bans.build]
executables = "deny"
allow-build-scripts = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/tonalisk-labs/kit"]
