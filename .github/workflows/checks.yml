# Each repo's pull-request checks: `mise run check`, the command a developer runs before pushing.
name: checks

on:
  workflow_call:

permissions: {}

# bash with pipefail, so a command failing inside a pipe fails its step.
defaults:
  run:
    shell: bash

# Each job's timeout-minutes ends a runner or download that has hung, which GitHub would
# otherwise hold for 6 hours.
jobs:
  check:
    name: mise run check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Its `git init` names the branch, and a pull request's merge ref or a release's tag is
        # detached on purpose: no advice.
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.detachedHead
          GIT_CONFIG_VALUE_1: 'false'
        with:
          persist-credentials: false
      # One mise release on every runner, its latest, so each job runs the same task runner.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
      - if: hashFiles('Cargo.lock') != ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      # Playwright's browsers and their Ubuntu packages come from a cache keyed on the runner image
      # and Playwright's version: a run that finds it needs neither Ubuntu's mirrors nor the CDN.
      - id: playwright
        if: hashFiles('node_modules/@playwright/test/package.json') != ''
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          image="$(printenv ImageOS)-$(printenv ImageVersion)"
          echo "key=playwright-${image}-${RUNNER_ARCH}-${version}" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        if: steps.playwright.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: ${{ steps.playwright.outputs.key }}
      # A miss keeps the packages the browsers lack, as apt resolves them, and the lists it read.
      - if: steps.playwright.outputs.key != '' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          store="$HOME/.cache/playwright-apt"
          mkdir -p "$store/archives" "$store/lists"
          # A mirror out of reach fails the run here, in seconds, not package by package later.
          bounds=(-o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10)
          sudo apt-get update --error-on=any "${bounds[@]}"
          # It exits 1 when it lists packages, as it does on a fresh runner.
          report=$(npx playwright install-deps --dry-run) ||
            grep -q '^Missing system dependencies' <<< "$report"
          sed -n 's/^  //p' <<< "$report" > "$store/packages"
          if [ -s "$store/packages" ]; then
            xargs sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              "${bounds[@]}" --download-only < "$store/packages"
            cp /var/cache/apt/archives/*.deb "$store/archives/"
          fi
          sudo find /var/lib/apt/lists -maxdepth 1 -type f ! -name lock \
            -exec cp -t "$store/lists" {} +
          sudo chown -R "$USER" "$store"
          npx playwright install
      - if: steps.playwright.outputs.key != '' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: ${{ steps.playwright.outputs.key }}
      # apt installs from the kept packages alone, with the lists they came from.
      - if: steps.playwright.outputs.key != ''
        run: |
          store="$HOME/.cache/playwright-apt"
          if [ -s "$store/packages" ]; then
            sudo cp "$store/lists/"* /var/lib/apt/lists/
            sudo cp "$store/archives/"*.deb /var/cache/apt/archives/
            xargs sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              --no-download < "$store/packages"
          fi
          npx playwright install
      - run: mise run check

  title:
    name: pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # to read the title it checks
    steps:
      # The squash merge takes the title as its commit, so the title is what the changelog reads.
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
