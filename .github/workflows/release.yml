# Each public repo's releases. release-please keeps a release PR open with the changelog; merging it
# tags the version. The tagged commit then passes `mise run release-check`, and
# `mise run artifacts` writes the release files to out/ and, for Pages, the site to pages/. Each
# file is attested and attached to the GitHub Release, with an SBOM. Optionally the package goes to
# npm, through npm's trusted publishing, and the site is uploaded for pages.yml to deploy.
#
# The build runs the repo's own code and its dependencies, so it holds only a read token. Signing,
# attaching and publishing happen in jobs that run nothing from the repo, each holding only what it
# needs.
#
# The release PR is opened with a GitHub App's token, since a PR opened with GITHUB_TOKEN starts
# no workflow and would never be checked. The App's client ID (RELEASE_APP_CLIENT_ID) and key
# (RELEASE_APP_KEY) live in the calling repo's `release` environment. A caller can't pass that
# secret, and its own expression for it is empty, but a job here that names the environment uses
# the environment's value once the caller passes the name, as `please` does.
name: release

on:
  workflow_call:
    inputs:
      pages:
        description: Upload pages/ as the run's Pages artifact, which pages.yml deploys.
        type: boolean
        default: false
      npm:
        description: Publish out/*.tgz to npm with trusted publishing.
        type: boolean
        default: false
    secrets:
      RELEASE_APP_KEY:
        description: The release App's private key, from the caller's `release` environment.
        required: true
    outputs:
      created:
        description: Whether this run made a release.
        value: ${{ jobs.please.outputs.created }}
      tag:
        description: The release's tag, when this run made one.
        value: ${{ jobs.please.outputs.tag }}

permissions: {}

# bash with pipefail, so a command failing inside a pipe fails its step.
defaults:
  run:
    shell: bash

# Each job's timeout-minutes ends a runner or download that has hung, which GitHub would
# otherwise hold for 6 hours.
jobs:
  please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions: {}
    outputs:
      created: ${{ steps.please.outputs.release_created }}
      tag: ${{ steps.please.outputs.tag_name }}
    steps:
      # `required: true` checks only that the caller passes the name, never that it has a value.
      - name: The release App's key has a value
        env:
          KEY: ${{ secrets.RELEASE_APP_KEY }}
        run: |
          [[ -n "${KEY}" ]] || {
            echo "::error::RELEASE_APP_KEY is empty:" \
              "set it in this repository's release environment"
            exit 1
          }
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}

  build:
    name: check and build
    needs: please
    if: needs.please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read # to check out the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.please.outputs.tag }}
          persist-credentials: false
      # One mise release on every runner, its latest, so each job runs the same task runner. Nothing
      # cached: what the release attests comes from the tagged commit and its lockfiles alone.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          cache: false
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      # The release check's tests may drive Playwright's browsers, which the runner doesn't carry.
      - if: hashFiles('node_modules/@playwright/test/package.json') != ''
        run: npx playwright install --with-deps
      - run: mise run release-check
      - run: mise run artifacts
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          output-file: out/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out/
          if-no-files-found: error
          retention-days: 1
      - if: inputs.pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

  attest:
    name: attest and attach
    needs: [please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # to attach the files to the release
      id-token: write # to sign the attestations
      attestations: write # to store the attestations
    env:
      TAG: ${{ needs.please.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: out/*
          sbom-path: out/sbom.spdx.json
      - run: gh release upload "$TAG" out/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # npm's trusted publisher names the calling workflow and this environment. Its OIDC token is the
  # only credential, and the provenance it signs ties the package to this run.
  npm:
    name: publish to npm
    needs: [please, attest]
    if: inputs.npm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read # to read mise.toml's Node, whose npm publishes through OIDC
      id-token: write # to publish with npm's trusted publishing and sign the provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.please.outputs.tag }}
          persist-credentials: false
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          install_args: node
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - run: npm publish out/*.tgz --provenance --access public
