name: ci

on:
  pull_request:
  # A push to main runs the check too, so its caches, which every pull request reads, stay filled.
  push:
    branches: [main]

permissions: {}

# bash with pipefail, so a command failing inside a pipe fails its step.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  # A newer push waits for a running check, never cut short, and replaces one still queued.
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read # to check out the code
      pull-requests: read # to read the pull request's title

  # downstream, this build under each site's own check, returns as each site reaches GitHub with its
  # code and kit 1.0.2 pinned: marcoferra.com, teoria-musical.com, then astronotes.eu (private).
